<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Principal Centrada</title>
    <!-- Bootstrap 5 CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Contenedor de altura completa con Flexbox para centrar -->
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        
        <!-- Tarjeta Principal (Card) -->
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 450px; width: 100%;">
            
            <!-- Imagen superior opcional -->
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSapNtzL5L6CngbuTCs6mRkEOzfVmL2wuukKM2kl9cw1cImqOHZ1TyZC48&s=10" class="card-img-top rounded-top-4" alt="Imagen de portada">

            <div class="card-body p-4 text-center">
                <h2 class="card-title fw-bold h4 mb-3">Valeria sofia</h2>
                <p class="card-text text-muted mb-4">
                    Esta es una tarjeta centrada perfectamente en la pantalla usando las clases de Flexbox y dimensiones de Bootstrap 5.
                </p>
                <a href="../html/index.html" class="btn btn-outline-primary">regresar</a>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle opcional -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
