<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dos Tarjetas con Bootstrap</title>
  <!-- CSS de Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <!-- Fila para alinear las tarjetas al centro -->
    <div class="row justify-content-center g-4">
      
      <!-- Tarjeta 1 -->
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSapNtzL5L6CngbuTCs6mRkEOzfVmL2wuukKM2kl9cw1cImqOHZ1TyZC48&s=10" class="card-img-top" alt="Imagen 1">
          <div class="card-body">
            <h5 class="card-title">Valeria sofia</h5>
            <p class="card-text">Este es el contenido de la primera tarjeta usando clases nativas de Bootstrap.</p>
            <a href="../Usuarios/valeria.html" class="btn btn-outline-primary">Ver más</a>
          </div>
        </div>
      </div>

      <!-- Tarjeta 2 -->
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCnPAdr_ioJ2rPKCPwSJj6PI4wgHy9JOvk3QwfvgRvUWdDgkQ7L4iNjvty&s=10" class="card-img-top rounded-top-4" class="card-img-top" alt="Imagen 2">
          <div class="card-body">
            <h5 class="card-title">Fernando Bravo</h5>
            <p class="card-text">Esta es la segunda tarjeta. Gracias a Bootstrap se adaptan a celulares y pantallas grandes.</p>
            <a href="../Usuarios/fernando.html" class="btn btn-outline-primary">Ver más</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript de Bootstrap (opcional para componentes interactivos) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
